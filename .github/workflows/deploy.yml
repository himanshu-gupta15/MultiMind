name: multimind deployment

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID || '547688237824' }}

jobs:

  # =========================
  # BACKEND DEPLOYMENT
  # =========================
  deploy-backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # =========================
      # GATEWAY
      # =========================
      - name: Build Gateway
        run: |
          docker build \
            -f backend/gateway/Dockerfile \
            -t gateway \
            backend

      - name: Tag Gateway
        run: |
          docker tag gateway:latest \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/gateway:latest

      - name: Push Gateway
        run: |
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/gateway:latest

      # =========================
      # AUTH SERVICE
      # =========================
      - name: Build Auth
        run: |
          docker build \
            -f backend/services/auth/Dockerfile \
            -t auth-service \
            backend

      - name: Tag Auth
        run: |
          docker tag auth-service:latest \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/auth-service:latest

      - name: Push Auth
        run: |
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/auth-service:latest

      # =========================
      # CHAT SERVICE
      # =========================
      - name: Build Chat
        run: |
          docker build \
            -f backend/services/chat/Dockerfile \
            -t chat-service \
            backend

      - name: Tag Chat
        run: |
          docker tag chat-service:latest \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/chat-service:latest

      - name: Push Chat
        run: |
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/chat-service:latest

      # =========================
      # AGENT SERVICE
      # =========================
      - name: Build Agent
        run: |
          docker build \
            -f backend/services/agent/Dockerfile \
            -t agent-service \
            backend

      - name: Tag Agent
        run: |
          docker tag agent-service:latest \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/agent-service:latest

      - name: Push Agent
        run: |
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/agent-service:latest

      # =========================
      # BILLING SERVICE
      # =========================
      - name: Build Billing
        run: |
          docker build \
            -f backend/services/billing/Dockerfile \
            -t billing-service \
            backend

      - name: Tag Billing
        run: |
          docker tag billing-service:latest \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/billing-service:latest

      - name: Push Billing
        run: |
          docker push \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/billing-service:latest

      # =========================
      # ECS DEPLOYMENTS
      # =========================

      - name: Deploy Gateway
        run: |
          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER || 'backend' }}" \
            --service "${{ secrets.GATEWAY_SERVICE || secrets.GATEWAY || 'gateway-service' }}" \
            --force-new-deployment

      - name: Deploy Auth
        run: |
          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER || 'backend' }}" \
            --service "${{ secrets.AUTH_SERVICE || 'auth-service' }}" \
            --force-new-deployment

      - name: Deploy Chat
        run: |
          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER || 'backend' }}" \
            --service "${{ secrets.CHAT_SERVICE || 'chat-service' }}" \
            --force-new-deployment

      - name: Deploy Agent
        run: |
          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER || 'backend' }}" \
            --service "${{ secrets.AGENT_SERVICE || 'agent-service' }}" \
            --force-new-deployment

      - name: Deploy Billing
        run: |
          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER || 'backend' }}" \
            --service "${{ secrets.BILLING_SERVICE || 'billing-service' }}" \
            --force-new-deployment


  # =========================
  # FRONTEND DEPLOYMENT
  # =========================
  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyDTn9etdn9Rfao57QdAydYqk_2zb84Tp4g' }}
          VITE_SERVER_URL: ${{ secrets.VITE_SERVER_URL || 'https://d21pqukh5ynert.cloudfront.net' }}
          VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID || 'rzp_test_SyOUwg44vZwY2T' }}
        run: |
          cd frontend
          npm install
          npm run build

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload Frontend to S3
        run: |
          aws s3 sync \
            frontend/dist \
            s3://${{ secrets.S3_BUCKET || 'multimind-frontend-547688237824-ap-south-1-an' }} \
            --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.CLOUDFRONT_DISTRIBUTION_ID || 'ER6SC9GAB2F2Y' }}" \
            --paths "/*"
